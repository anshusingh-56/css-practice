<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo Classes and Elements</title>

    <link rel="stylesheet" href="style.css">

</head>
<body>

    <h1>Pseudo Classes & Pseudo Elements</h1>

    <h2>Hover Example</h2>

    <button class="hover-button">
        Hover me
    </button>

    <h2>Focus Example</h2>

    <input type="text" class="focus-input" placeholder="click here and type..">

    <h2>First Child Example</h2>

    <ul class="list">
        <li>First Item</li>
        <li>Second Item</li>
        <li>Third Item</li>
    </ul>
    
    <h2>Pseudo Element Example</h2>

    <p class="before-text">
        This text has content before it.
    </p>

    <p class="after-text">
        This text has content after it.
    </p>

</body>
</html>
