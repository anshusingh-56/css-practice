<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors and Background</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    
    <h1>Colors and Backgrounds</h1>

    <p class="color-name">
        This uses a color name.
    </p>

    <p class="hex-color">
        This uses a HEX color.
    </p>

    <p class="rgb-color">
        This uses a RGB color.
    </p>

    <p class="rgba-color">
        This uses a RGBA color.
    </p>

    <div class="background-box">
        This box has a background color.
    </div>

    <div class="gradient-box">
        This box has a gradient background.
    </div>

</body>
</html>
